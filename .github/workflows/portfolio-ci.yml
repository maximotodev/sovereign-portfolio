name: Portfolio build verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: ./node_modules/.bin/tsc --noEmit
      - name: Lint active app and editorial code
        run: npx eslint src/app src/components/NostrJournal.tsx src/components/CopyNpub.tsx src/components/SystemsLab.tsx src/components/editorial src/components/newsletter src/components/layout/SiteNavigation.tsx src/lib/nostr-publishing.ts src/lib/portfolio-data.ts src/lib/editorial-state.ts src/lib/freedom-signal.ts src/lib/studio-draft-transfer.ts src/lib/system-cases.ts
      - name: Editorial and architecture tests
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
